name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # api 타입체크·린트는 생성된 Prisma Client가 필요
      - run: pnpm --filter @joblog/api exec prisma generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  # PR 데모 영상: E2E 플로우를 녹화해 아티팩트로 올리고 PR에 링크를 코멘트한다.
  # 비필수(머지 차단 아님) — 실패해도 영상·코멘트는 남긴다.
  e2e-demo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run E2E (녹화)
        # 데모 영상은 순차 실행이 재생이 깔끔하고 플레이크도 적다.
        run: pnpm --filter web exec playwright test --workers=1
      - name: Upload demo videos
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-video-pr-${{ github.event.pull_request.number }}
          path: apps/web/test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 14
      - name: Comment video link on PR
        if: always()
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- demo-video -->';
            const url = process.env.ARTIFACT_URL;
            const body = url
              ? `${marker}\n🎬 **데모 영상 자동 생성**\n\n이 PR의 E2E 플로우를 녹화했어요.\n▶️ [영상 받기](${url}) · zip 안에 \`.webm\`\n\n<sub>CI에서 Playwright로 녹화 · 머지 차단용 아님</sub>`
              : `${marker}\n🎬 데모 영상: 이번 실행에서 녹화 파일을 찾지 못했어요. E2E가 전부 실패했을 수 있어요. [실행 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 확인해 주세요.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
