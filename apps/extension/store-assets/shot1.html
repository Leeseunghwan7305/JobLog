<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Apple SD Gothic Neo','Pretendard',system-ui,-apple-system,'Malgun Gothic',sans-serif;}
  :root{--primary:#3182f6;}
  html,body{width:1280px;height:800px;overflow:hidden;}
  body{background:linear-gradient(160deg,#eef3fb 0%,#e3ebf7 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;position:relative;}
  .headline{text-align:center;}
  .headline h1{font-size:46px;font-weight:850;color:#13171f;letter-spacing:-1.5px;}
  .headline h1 b{color:var(--primary);}
  .headline p{font-size:21px;color:#5b6472;margin-top:12px;font-weight:500;}
  .stage{position:relative;width:1020px;height:460px;}
  /* 공고 브라우저 창 목업 */
  .win{position:absolute;inset:0;background:#fff;border-radius:16px;box-shadow:0 30px 70px -20px rgba(20,40,80,.3);overflow:hidden;border:1px solid #dbe3ee;}
  .bar{height:46px;background:#f4f6fa;border-bottom:1px solid #e6eaf1;display:flex;align-items:center;gap:8px;padding:0 16px;}
  .dot{width:12px;height:12px;border-radius:50%;}
  .url{margin-left:14px;flex:1;height:26px;background:#fff;border:1px solid #e2e8f1;border-radius:7px;display:flex;align-items:center;padding:0 12px;font-size:13px;color:#8a93a3;}
  .jd{padding:40px 54px;}
  .jd .co{font-size:15px;color:var(--primary);font-weight:700;}
  .jd h2{font-size:30px;font-weight:800;color:#13171f;margin-top:6px;}
  .jd .meta{display:flex;gap:10px;margin-top:16px;}
  .jd .tag{font-size:13px;color:#5b6472;background:#f1f4f9;border-radius:7px;padding:5px 12px;}
  .jd .line{height:13px;background:#eef1f6;border-radius:6px;margin-top:22px;}
  .jd .line.w1{width:78%;}.jd .line.w2{width:64%;}.jd .line.w3{width:72%;}
  /* 익스텐션 팝업 */
  .ext{position:absolute;top:10px;right:-18px;width:306px;background:#fff;border-radius:16px;box-shadow:0 24px 50px -12px rgba(20,40,80,.4);border:1px solid #e2e8f1;padding:20px;z-index:5;}
  .ext .eh{display:flex;align-items:center;gap:10px;}
  .ext .j{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;}
  .ext .en{font-weight:800;font-size:15px;color:#13171f;}
  .ext .ed{font-size:12.5px;color:#7a8290;margin-top:14px;line-height:1.5;}
  .ext .btn{margin-top:16px;background:var(--primary);color:#fff;border-radius:11px;height:50px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;box-shadow:0 8px 18px -6px rgba(49,130,246,.6);}
  .ext .hint{text-align:center;font-size:11.5px;color:#9aa2b1;margin-top:10px;}
  .cursor{position:absolute;top:150px;right:60px;z-index:6;font-size:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));}
</style></head><body>
  <div class="headline"><h1>보던 공고를, <b>클릭 한 번</b>으로 담기</h1><p>복사·붙여넣기 없이 — 원티드·잡코리아·사람인 어디서든</p></div>
  <div class="stage">
    <div class="win">
      <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><div class="url">wanted.co.kr/wd/396517</div></div>
      <div class="jd">
        <div class="co">어스얼라이언스</div>
        <h2>플랫폼 파트 — Frontend Developer</h2>
        <div class="meta"><span class="tag">📍 서울 마포구</span><span class="tag">💼 정규직</span><span class="tag">🗓 ~2026-12-31</span></div>
        <div class="line w1"></div><div class="line w2"></div><div class="line w3"></div>
      </div>
    </div>
    <div class="ext">
      <div class="eh"><div class="j">J</div><div class="en">JobLog — 공고 담기</div></div>
      <div class="ed">지금 보고 있는 채용 공고를<br>JobLog에 담습니다.</div>
      <div class="btn">＋ 이 공고 담기</div>
      <div class="hint">로그인된 JobLog 세션이 분석·저장해요</div>
    </div>
    <div class="cursor">👆</div>
  </div>
</body></html>
