<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --primary: #3182f6; --ink: #eaeaec; --muted: #8b8e95; }
  html, body { width: 1280px; height: 800px; }
  body {
    font-family: 'Apple SD Gothic Neo','Pretendard',system-ui,-apple-system,'Malgun Gothic',sans-serif;
    background:
      radial-gradient(900px 500px at 88% -5%, rgba(49,130,246,0.2), transparent 60%),
      radial-gradient(700px 480px at -5% 108%, rgba(80,70,220,0.15), transparent 55%),
      linear-gradient(160deg,#0c0e11 0%,#121418 100%);
    color: var(--ink); overflow: hidden;
  }
  .wrap { display: flex; height: 100%; align-items: center; gap: 56px; padding: 0 72px; }

  /* 왼쪽: 담김 완료 → 앱 카드 */
  .scene { flex: 1; display: flex; justify-content: center; position: relative; }
  .app {
    width: 600px; border-radius: 16px; overflow: hidden;
    background: #16181c; border: 1px solid #2a2e35; box-shadow: 0 40px 90px rgba(0,0,0,0.55);
  }
  .app-bar { display: flex; align-items: center; gap: 9px; padding: 14px 18px; border-bottom: 1px solid #262a30; }
  .app-bar .j { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--primary); color: #fff; font-weight: 800; font-size: 14px; }
  .app-bar .nm { font-weight: 800; font-size: 15px; }
  .card { padding: 22px 24px 26px; }
  .co { font-size: 13px; color: var(--primary); font-weight: 700; }
  .ttl { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
  .meta { margin-top: 10px; display: flex; gap: 8px; }
  .meta span { font-size: 12px; color: #aab0ba; background: #22262d; padding: 5px 10px; border-radius: 7px; }
  .track-label { margin-top: 22px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
  .track { margin-top: 10px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .st { font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 8px; }
  .st.now { background: rgba(49,130,246,0.16); color: #6ea8ff; border: 1px solid rgba(49,130,246,0.4); }
  .st.wait { background: #22262d; color: #9aa0aa; }
  .arr { color: #525862; font-size: 12px; }

  .toast {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 9px;
    background: #14301f; border: 1px solid #1f7a4d; color: #7ee3a9;
    padding: 11px 16px; border-radius: 11px; font-size: 14px; font-weight: 700;
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }
  .toast .c { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #1f7a4d; color: #d1fae5; font-size: 12px; }

  /* 오른쪽: 카피 */
  .copy { width: 440px; flex-shrink: 0; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #cdd3dd; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 7px 13px; border-radius: 999px; margin-bottom: 24px; }
  .badge .j { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--primary); color: #fff; font-weight: 800; font-size: 12px; }
  h1 { font-size: 46px; font-weight: 800; line-height: 1.16; letter-spacing: -0.03em; }
  h1 .hl { color: var(--primary); }
  .sub { margin-top: 18px; font-size: 18px; line-height: 1.6; color: #aab0ba; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="scene">
      <div class="toast"><span class="c">✓</span> 토스 담았어요</div>
      <div class="app">
        <div class="app-bar"><span class="j">J</span><span class="nm">JobLog</span></div>
        <div class="card">
          <div class="co">토스 (비바리퍼블리카)</div>
          <div class="ttl">프론트엔드 개발자</div>
          <div class="meta"><span>서울 강남구</span><span>정규직</span><span>규모 1,800명</span></div>
          <div class="track-label">전형 단계 (AI 자동 추출)</div>
          <div class="track">
            <span class="st now">서류</span><span class="arr">→</span>
            <span class="st wait">코딩테스트</span><span class="arr">→</span>
            <span class="st wait">1차 면접</span><span class="arr">→</span>
            <span class="st wait">2차 면접</span><span class="arr">→</span>
            <span class="st wait">최종</span>
          </div>
        </div>
      </div>
    </div>

    <div class="copy">
      <div class="badge"><span class="j">J</span> 담은 다음</div>
      <h1>담으면,<br><span class="hl">AI가 전형까지</span> 정리</h1>
      <p class="sub">회사·직무·전형 단계를 자동으로 뽑아내고, 서류부터 최종까지 어디까지 왔는지 한곳에서 추적해요.</p>
    </div>
  </div>
</body>
</html>
